# Motor Kratos (D11): golpes gerados do grafo do próprio GoW1 (TWK_CombatFile, tools/gow_combat.py).
# A partir de `roots`, segue as transições de □ (gatilho 0x02) e △ (0x03); a janela de cada transição é a do GoW1
# (antes do ponto de corte o botão fica guardado; depois, o golpe sai). Saída: kratosMoves_pl000_00_2.pac +
# KratosMoves.json. Fica para depois: grafo do ar, agarrão, magias e bloqueio.
roots: [71]            # COMBO3A (□ a partir do parado; o grafo do parado está fora dos CombatFile — [HIPÓTESE])
triggers: {light: 2, heavy: 3}
# ficha de dano do DMC3 (DamageData, RVA) por golpe do GoW1; o resto usa `default`
damage:
  default: 5C68C0       # leve (combo da Rebellion 3/3)
  heavy: 5C6960         # golpes de △: arremessa (finalizador 3/5)
  BLOCKLAUNCHER: 5C6C30 # lança (High Time)
# avanço do golpe no osso 0 (as animações do GoW1 são "no lugar") — [HIPÓTESE] até achar o deslocamento no GoW1
forward: {default: 35, heavy: 60, spell: 0}
# fora do protótipo: o motor usa o evento TAUNT do DMC3, que prende o Kratos no chão (o grafo do ar fica para depois)
exclude_prefix: [AIR, COMBOJUMP]
# magias (X = tiro do DMC3 com o motor ligado): a sequência inteira do GoW1, seguindo o gatilho "fim da animação"
# (0x0b) da tabela a partir da 1ª animação (T90): Zeus BOLTPULLOUT 60 → BOLTTHROW; Medusa PSENTHEAD 81 → USEHEAD →
# PUTAWAYHEAD; Poseidon AIRLIGHTNINGSTART 513 (versão do chão) → AIRLIGHTNINGLOOP → LIGHTNINGEXIT; Hades RAISETHEDEAD.
spells: {zeus: 60, poseidon: 513, hades: 508, medusa: 81}
# destinos de "fim" que encerram a sequência (voltam ao parado / Rage / queda / esquiva)
spell_chain_stop: [IDLECOMBAT, BERSERKENTER, FALLV, BERFALLN, EVADEBACK, EVADEFRONT, EVADELEFT, EVADERIGHT]
# animação da tabela → nome no glb quando difere (USEHEAD = mira; no glb são useHead00/01/02 = cima/meio/baixo)
anim_alias: {USEHEAD: useHead01}
# BOLTTHROWL = 2º arremesso (mão esquerda): só sai se o X for apertado de novo durante o BOLTTHROW, como no GoW1
# golpe da sequência em que o efeito sai e em que fração da animação (sem fração = quadro de maior velocidade da mão)
spell_fx: {BOLTTHROW: zeus, BOLTTHROWL: zeus, USEHEAD: medusa, AIRLIGHTNINGLOOP: poseidon, RAISETHEDEAD: hades}
spell_hit: {USEHEAD: 0.25, AIRLIGHTNINGLOOP: 0.2, RAISETHEDEAD: 0.5}
# esquivas (analógico direito, como no GoW1): golpes 514–517 do CombatFile 005, com as transições do GoW1 (□ → COMBO3A,
# △ → COMBO6A, agarrão, magia). Deslocamento no osso 0 em [x, z] (sinal de x como o rolamento do Trickster, T21)
evades: {front: 515, back: 514, left: 516, right: 517}
root: {EVADEFRONT: [0, 380], EVADEBACK: [0, -380], EVADELEFT: [380, 0], EVADERIGHT: [-380, 0]}
root_span: {evade: 0.75}
