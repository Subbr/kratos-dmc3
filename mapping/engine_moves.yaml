# Motor Kratos (D11): golpes gerados do grafo do próprio GoW1 (TWK_CombatFile, tools/gow_combat.py).
# O gerador fecha o grafo a partir das raízes seguindo TODAS as transições (T92) e exporta cada uma com gatilho, modo do
# botão, janela, chão/ar/Rage e nível da lâmina; a DLL interpreta a tabela (KratosMode.cpp, EngineStep).
#
# Gatilhos do GoW1 (+0x1C da transição; tabela gatilho → botão em 0x2C0AE8 do ELF, FUN_002072a0):
#   0x01 ✕ (pulo: COMBO4D → COMBOJUMP, L1+✕ → BLOCKLAUNCHER)   0x02 □   0x03 △   0x04 ○ (agarrão)
#   0x05 L1 (bloqueio)   0x06 R2 (magia)   0x08 R1 (DASH = Hermes Rush, AIRDASH = Hermes Stomp, R1×3 = Hermes Fury;
#   confirmado pela lista de golpes do próprio HUD do GoW1, FLP_HUD, T95)
#   0x0B fim da animação; com destino EVADE* = analógico direito   0x0C/0x13 analógico esquerdo (cancela andando)
#   0x10 golpe recebido no bloqueio (BLOCKREACTION / PARRY02)   0x11 agarrão pegou (finalização por inimigo)
#   0x0E morte, 0x14/0x16 [HIPÓTESE], fora do motor
triggers_used: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x08, 0x0B, 0x0C, 0x10, 0x11, 0x13]
# animações: glb do herói e glb das finalizações (Kratos com o grupo externo do ANM do herói guardado no WAD do
# inimigo; tools/export_gow1.sh com o gowb modificado, docs/formats/gow-wad.md). maiSka = legionário (MAISKB00…06)
glbs: [hero0/hero_obj.glb, finishers/maiSka.glb]
# golpes de agarrão: inimigo preso na mão, sem acerto das lâminas (o dano vem do próprio agarrão, KratosMode.cpp)
grab_prefix: [GRAB, MAISK]
# tabela do parado (o GoW1 não tem um golpe "parado" com □: a da aterrissagem COMBATLAND2 é a mesma do chão livre)
ground_root: 97        # COMBATLAND2
air_root: 10           # COMBOJUMP (□ AIRH1, △ AIRV1, R1 AIRDASH, L1 AIRBLOCK, magias no ar)
rage_ground_root: 559  # BERLAND (Rage of the Gods: BERCOMBO*)
rage_air_root: 590     # COMBOJUMP da Rage
# animações que não são golpe: voltar ao parado (DMC3) ou cair/aterrissar pelo DMC3
neutral_anims: [IDLECOMBAT, IDLECOMBAT2, STANDIDLE, BERSERKIDLE]
fall_anims: [COMBATLAND2, HIGHFALLLAND, FALLV, BERLAND, BERFALLN, COMBATFALL, AIRIMPALELAND, BERAIRV2LAND]
# fora do motor: reações a dano, morte, paredes, cordas, nado, congelado, entrada/saída da Rage (é o DT do DMC3),
# pulos de locomoção e agarrões ligados a um inimigo do GoW1 (as animações deles ficam nos WADs dos inimigos)
exclude_prefix: [HIT, DEATH, WALL, ROPE, SWIM, FREEZE, FROZEN, KICKBOX, BERSERKENTER, BERSERKEXIT, BERAIRENTER,
                 PARRYHIT, JUMP, LAND]
# ficha de dano do DMC3 (DamageData, RVA) por golpe do GoW1; o resto usa `default`
damage:
  default: 5C68C0       # leve (combo da Rebellion 3/3)
  heavy: 5C6960         # golpes de △: arremessa (finalizador 3/5)
  BLOCKLAUNCHER: 5C6C30 # lança (High Time)
  COMBO6A: 5C6960
  COMBO7A: 5C6960
  COMBO3F: 5C6960
  BRUTAL1: 5C6960
  AIRV1: 5C6960
heavy: [COMBO6A, COMBO7A, COMBO4D, COMBO3F, BRUTAL1, BRUTAL3, AIRV1, BERCOMBOV1, BERCOMBOV2, BERCOMBOV3, BERCOMBOV4]
# magias (R2 do GoW1 = X/tiro do DMC3 com o motor ligado): a sequência inteira do GoW1, seguindo o gatilho "fim da
# animação" (0x0b) da tabela (T90): Zeus BOLTPULLOUT 60 → BOLTTHROW; Medusa PSENTHEAD 81 → USEHEAD → PUTAWAYHEAD;
# Poseidon AIRLIGHTNINGSTART 513 (versão do chão) → AIRLIGHTNINGLOOP → LIGHTNINGEXIT; Hades RAISETHEDEAD.
spells: {zeus: 60, poseidon: 513, hades: 508, medusa: 81}
# no ar (COMBOJUMP → 0x06): AIRBOLTTHROW 63, AIRUSEHEAD 84, AIRLIGHTNINGSTART 506, AIRRAISETHEDEAD 509
air_spells: {zeus: 63, poseidon: 506, hades: 509, medusa: 84}
# animação da tabela → nome no glb quando difere (USEHEAD = mira; no glb são useHead00/01/02 = cima/meio/baixo)
anim_alias: {USEHEAD: useHead01}
# golpe da sequência em que o efeito sai e em que fração da animação (sem fração = quadro de maior velocidade da mão)
spell_fx: {BOLTTHROW: zeus, BOLTTHROWL: zeus, USEHEAD: medusa, AIRLIGHTNINGLOOP: poseidon, RAISETHEDEAD: hades,
           AIRBOLTTHROW: zeus, AIRUSEHEAD: medusa, AIRRAISETHEDEAD: hades}
spell_hit: {USEHEAD: 0.25, AIRLIGHTNINGLOOP: 0.2, RAISETHEDEAD: 0.5, AIRUSEHEAD: 0.3, AIRRAISETHEDEAD: 0.5}
# esquivas (analógico direito, como no GoW1): golpes 514–517 do CombatFile 005; na Rage, 586–589
evades: {front: 515, back: 514, left: 516, right: 517}
rage_evades: {front: 586, back: 587, left: 588, right: 589}
