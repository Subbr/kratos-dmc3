# Motion do Dante (arquivo pl000_00_N.pac, índice) -> animação do Kratos (GoW1, nome no glb).
# timing: stretch = ocupa a duração da motion do Dante; natural = 60 fps, último quadro parado até o fim.
# loop: true = animação que repete (o último quadro converge para o primeiro).
# O osso 0 (deslocamento do personagem) sempre vem da motion do Dante.
# Evidência de cada índice em docs/formats/mot.md (seção "Índices conhecidos").
pl000_00_0:   # BASE
  0:  {anim: idleCombat, timing: stretch, loop: true}    # parada
  1:  {anim: walkBlend1, timing: stretch, loop: true}    # caminhada (pés alternam, osso 0 TZ +214)
  58: {anim: idleCombat, timing: stretch, loop: true}    # parada (variação)
  2:  {anim: walkBlend2, timing: stretch, loop: true}    # corrida (Crimson: "playerRunning" = motion 2/51/30)
  51: {anim: walkBlend2, timing: stretch, loop: true}    # corrida (variação)
  6:  {anim: land, timing: stretch}          # aterrissagem
  16: {anim: jumpAir, timing: stretch}       # no ar (pose de queda)
  7:  {anim: evadeLeft, timing: stretch}     # rolamento para a esquerda (osso 0 TX +350)
  8:  {anim: evadeRight, timing: stretch}    # rolamento para a direita (osso 0 TX -350)
pl000_00_2:   # TAUNTS: o taunt (Back) vira o agarrão do GoW1 (§7.1; T33 — a DLL finaliza o inimigo perto)
  0:  {anim: grab+idleCombat, timing: natural}    # agarra e volta à postura de combate
  1:  {anim: grab+idleCombat, timing: natural}    # o outro taunt sorteado (T33: 2/0 e 2/1)
pl000_00_3:   # REBELLION (slot das Blades of Chaos, D1)
  0:  {anim: idleCombat, timing: stretch, loop: true}    # guarda com a arma
  1:  {anim: idleCombat, timing: stretch, loop: true}
  3:  {anim: combo3A, timing: strike}        # combo 1, golpe 1 (CrimsonFX.cpp:467)
  4:  {anim: combo3B, timing: strike}        # combo 1, golpe 2
  5:  {anim: combo3C, timing: strike}        # combo 1, golpe 3
  6:  {anim: combo3D, timing: strike}        # combo 2, golpe 2 (CrimsonFX.cpp:468)
  7:  {anim: combo3E, timing: strike}        # combo 2, golpe 3
  16: {anim: dash, timing: strike}           # Stinger nível 1 (CrimsonDetours.cpp:449)
  13: {anim: blockLauncher, timing: strike}  # High Time (lançador): pose e teste T10
  10: {anim: airImpale+airImpaleLand, timing: strike}  # golpe aéreo para baixo até o chão (pulo + ataque; T20)
pl000_00_13:  # SWORDMASTER_REBELLION (L = ação de estilo; T23 com testStyle 0)
  7:  {anim: airH1, timing: strike}          # Aerial Rave 1 (L no ar)
  8:  {anim: airH2, timing: strike}          # Aerial Rave 2
  9:  {anim: airH3, timing: strike}          # Aerial Rave 3
  10: {anim: airV1, timing: strike}          # Aerial Rave 4 (fecha para baixo)
  19: {anim: comboLR2, timing: strike}       # Prop (L no chão): lâminas abertas girando
pl000_00_24:  # ROYALGUARD (L segurado = bloqueio do GoW1, §7.1; T24). O jogo toca 24/30 → entrada 0 e 24/31 → entrada 1
  0:  {anim: block, timing: stretch}         # entra e segura a guarda
  1:  {anim: block+idleCombat, timing: stretch}  # solta a guarda (volta à postura de combate)
  2:  {anim: blockReaction, timing: stretch} # bloqueio atingido
  15: {anim: parry01, timing: strike}        # Release 1 (trava + trás + L; T39)
  16: {anim: parry02, timing: strike}        # Release 2
# timing strike: o quadro de maior velocidade da mão do Kratos cai no mesmo quadro do golpe do Dante
pl000_00_23:  # TRICKSTER (estilo do save; L = ação de estilo): dash vira o rolamento do GoW1 (§7.1, T21)
  0:  {anim: evadeFront, timing: natural}    # dash para a frente (osso 0 TZ +400)
  1:  {anim: evadeBack, timing: natural}     # para trás (TZ -400)
  2:  {anim: evadeLeft, timing: natural}     # esquerda (TX +400, mesmo sentido do 0/7)
  3:  {anim: evadeRight, timing: natural}    # direita (TX -400)
pl000_00_4:   # CERBERUS (Kratos sem a arma: lâminas do corpo; T45, índices de tools/win/motion_probe.sh 1)
  0:  {anim: idleCombat, timing: stretch, loop: true}
  1:  {anim: idleCombat, timing: stretch, loop: true}
  3:  {anim: combo3A, timing: strike}        # combo 4/3 → 4/4 → 4/5
  4:  {anim: combo3B, timing: strike}
  5:  {anim: combo3C, timing: strike}
  8:  {anim: combo3D, timing: strike}        # combo com pausa
  10: {anim: combo3E, timing: strike}
  11: {anim: airH1, timing: strike}          # no ar
  19: {anim: dash, timing: strike}           # trava + trás
  24: {anim: comboLR2, timing: strike}
  25: {anim: blockLauncher, timing: strike}
pl000_00_6:   # NEVAN (T45, motion_probe.sh 3)
  0:  {anim: idleCombat, timing: stretch, loop: true}
  1:  {anim: idleCombat, timing: stretch, loop: true}
  3:  {anim: combo3A, timing: strike}        # combo 6/3 → 6/6 → 6/9 → 6/8
  6:  {anim: combo3B, timing: strike}
  9:  {anim: combo3C, timing: strike}
  8:  {anim: combo3D, timing: strike}
  10: {anim: combo3E, timing: strike}
  4:  {anim: comboLR2, timing: strike}       # frente / segurar
  5:  {anim: combo3B, timing: strike}
  16: {anim: dash, timing: strike}           # trava + trás
  15: {anim: airH1, timing: strike}          # no ar
pl000_00_7:   # BEOWULF (T45, motion_probe.sh 4)
  0:  {anim: idleCombat, timing: stretch, loop: true}
  1:  {anim: idleCombat, timing: stretch, loop: true}
  3:  {anim: combo3A, timing: strike}        # combo 7/3 → 7/4 → 7/5
  4:  {anim: combo3B, timing: strike}
  5:  {anim: combo3C, timing: strike}
  25: {anim: airH2, timing: strike}          # no ar
